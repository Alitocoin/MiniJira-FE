name: CI — MiniJira Frontend

on:
  push:
    branches:
      - main
      - development
      - feat/test-05-cicd
  pull_request:
    branches:
      - main
      - development
      - feat/test-05-cicd

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build y pruebas unitarias
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Compilar el proyecto
        run: npm run build

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: Verificación de tipos TypeScript
  # El proyecto no tiene ESLint configurado.
  # Se usa tsc --noEmit como herramienta de análisis
  # estático equivalente (ver decisiones técnicas en
  # MiniJira-Docs/docs/test-05-cicd.md).
  # ─────────────────────────────────────────────
  lint:
    name: Lint (TypeScript type-check)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Verificar tipos con TypeScript
        run: ./node_modules/.bin/tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 3: Análisis de vulnerabilidades en dependencias
  # ─────────────────────────────────────────────
  security:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Auditar vulnerabilidades de dependencias
        run: npm audit --audit-level=high
